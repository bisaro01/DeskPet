image: eclipse-temurin:21

stages:
  - probe

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  paths:
    - .gradle/

test:
  stage: probe
  tags:
    - shell
  script:
    - echo "=== SYSTEM INFO ==="
    - uname -a

    - echo "\n=== USER ==="
    - whoami

    - echo "\n=== PATH ==="
    - echo $PATH

    - echo "\n=== JAVA ==="
    - which java || echo "java not found"
    - java -version || echo "no java"

    - echo "\n=== JAVAC ==="
    - which javac || echo "javac not found"
    - javac -version || echo "no javac"

    - echo "\n=== GRADLE ==="
    - which gradle || echo "gradle not found"

    - echo "\n=== HOME CONTENTS ==="
    - ls -la ~
