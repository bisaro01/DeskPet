image: eclipse-temurin:21

stages:
  - test
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  paths:
    - .gradle/

.before_script_template: &java_setup
  # Ensure java 21 installed and being used
  - source "$HOME/.sdkman/bin/sdkman-init.sh"
  - sdk install java 21-tem -y
  - sdk use java 21-tem
  - java -version

test:
  stage: test
  tags:
    - shell
  before_script: *java_setup
  script:
    # run tests
    - chmod +x gradlew
    - ./gradlew test --no-daemon --no-configuration-cache

build:
  stage: build
  tags:
    - shell
  needs: ["test"] # depend on test job (test stage must run first)
  before_script: *java_setup
  script:
    # build project
    - ./gradlew build --no-daemon --no-configuration-cache