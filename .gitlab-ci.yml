image: eclipse-temurin:21

stages:
  - build
  - test
  - build-wio

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  paths:
    - .gradle/

.before_script_template: &java_setup
  # Ensure java 21 installed and being used
  - source "$HOME/.sdkman/bin/sdkman-init.sh"
  - sdk install java 21-tem -y
  - sdk use java 21-tem
  - java -version

test:
  stage: test
  tags:
    - shell
  needs: ["build"] # depend on build job (build stage must run first)
  before_script: *java_setup
  script:
    # run tests
    - chmod +x gradlew
    - ./gradlew test --no-daemon --no-configuration-cache --rerun-tasks

build:
  stage: build
  tags:
    - shell
  before_script: *java_setup
  artifacts:
    paths:
      - build/
  script:
    # build project
    - chmod +x gradlew
    - ./gradlew build --no-daemon --no-configuration-cache

build-wio:
  stage: build-wio
  tags:
    - shell
  script:
    - chmod +x arduino_src/arduino-setup.sh
    - ./arduino_src/arduino-setup.sh
    - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal arduino_src/desk_pet