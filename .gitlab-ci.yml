image: eclipse-temurin:21

stages:
  - test

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  paths:
    - .gradle/

test:
  stage: test
  tags:
    - shell
  script:
    # load sdkman
    - source "$HOME/.sdkman/bin/sdkman-init.sh"

    # install java (non-interactive)
    - sdk install java 21-tem -y
    - sdk use java 21-tem

    # verify
    - java -version

    # run gradle
    - chmod +x gradlew
    - ./gradlew build --no-daemon --no-configuration-cache